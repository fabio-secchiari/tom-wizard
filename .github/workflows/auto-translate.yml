name: Auto Translate + Build + PR

on:
  # Parte in automatico quando modifichi i capitoli inglesi
  push:
    branches: [main]
    paths:
      - 'chapters/**/*.tex'
      - 'scripts/translate_chapters.py'
      - 'Makefile'
      - 'main_*.tex'

  # Pulsante per avviarlo a mano da GitHub
  workflow_dispatch:

jobs:
  translate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ========== CACHE TEX LIVE (secondo documentazione ufficiale) ==========
      - name: Cache TeX Live
        id: cache-texlive
        uses: actions/cache@v4
        with:
          path: |
            ~/.texlive
            /tmp/texlive
            /usr/local/texlive
          key: texlive-full-${{ runner.os }}-2026-v1
          restore-keys: |
            texlive-full-${{ runner.os }}-2026-
            texlive-full-${{ runner.os }}-

      - name: Install TeX Live (solo se cache miss)
        if: steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      # ========== TRADUZIONE ==========
      - name: Detect changed English chapters
        id: changed
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          # Manual workflow → translate everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected → translating all chapters"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First push → translate everything
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push detected → translating all chapters"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          git diff --name-only "$BEFORE" "$AFTER"

          CHANGED=$(
            git diff --name-only "$BEFORE" "$AFTER" -- chapters/ \
              | while IFS= read -r file; do
                  case "$file" in
                    *.tex)
                      echo "${file#chapters/}"
                      ;;
                  esac
                done \
              | tr '\n' ' ' \
              | sed 's/[[:space:]]*$//'
          )

          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED" ]; then
            echo "Changed chapters: '$CHANGED'"
          else
            echo "No English chapters changed."
          fi

      - name: Translate changed chapters
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.files }}"

          if [ "$FILES" = "ALL" ]; then
            echo "Translating all chapters..."
            python scripts/translate_chapters.py

          elif [ -n "$FILES" ]; then
            echo "Translating changed chapters:"
            echo "$FILES"

            python scripts/translate_chapters.py $FILES

          else
            echo "No English chapters changed."
          fi

      # ========== COMPILAZIONE ==========
      - name: Compile all PDFs
        run: make all

      - name: Compress PDFs with Ghostscript
        run: |
          # Installa Ghostscript (se non già presente)
          sudo apt-get update
          sudo apt-get install -y ghostscript

          # Imposta una soglia (es. 10 MB) per comprimere solo i file grandi
          MAX_SIZE=10485760

          # Trova tutti i PDF generati (modifica il percorso se necessario, es. build/ o .)
          find . -name "*.pdf" -type f | while read -r pdf; do
            size=$(stat -c%s "$pdf")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "📦 Compressione di $pdf (dimensioni: $size byte)..."
              # Usa il profilo /ebook (150 dpi, buon compromesso)
              gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                -dNOPAUSE -dQUIET -dBATCH -sOutputFile="${pdf}.tmp" "$pdf" \
                && mv "${pdf}.tmp" "$pdf"
              # Se vuoi ancora più compressione (qualità minore) usa /screen
              # Se vuoi qualità migliore usa /printer
            else
              echo "⏩ Saltato $pdf (dimensioni: $size byte, sotto soglia)"
            fi
          done

      # ========== PULL REQUEST ==========
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-translate DE/FR + rebuild PDFs"
          title: "Auto-translate: update DE/FR + PDFs"
          body: |
            Traduzione automatica + ricompilazione PDF generata da DeepL.

            **File inglesi modificati:**
            `${{ steps.changed.outputs.files }}`

            Controlla le traduzioni e i PDF, poi fai merge.
          branch: auto-translate/${{ github.run_id }}
          delete-branch: true
          labels: translation, automated