name: Auto Translate + Build + PR

on:
  push:
    branches: [main]
    paths:
      - 'src/chapters/**.tex'
      - 'scripts/translate_chapters.py'
      - 'Makefile'
      - 'main_*.tex'

jobs:
  translate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---------- Cache TeX Live (il pezzo che fa la differenza) ----------
      - name: Cache TeX Live
        uses: actions/cache@v4
        id: texlive-cache
        with:
          path: ~/texlive
          key: texlive-full-${{ runner.os }}-2026

      - name: Install TeX Live (solo se non c'è in cache)
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full pandoc

      - name: Install Pandoc (sempre, è leggero)
        run: sudo apt-get install -y pandoc || true

      # ---------- Traduzione ----------
      - name: Detect changed English chapters
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/chapters/*.tex' | xargs -n1 basename 2>/dev/null | tr '\n' ' ' || true)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "File cambiati: '$CHANGED'"

      - name: Translate changed chapters
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            python scripts/translate_chapters.py ${{ steps.changed.outputs.files }}
          else
            echo "Nessun file capitolo modificato → salto traduzione"
          fi

      # ---------- Compilazione ----------
      - name: Compile all PDFs
        run: |
          make all

      # ---------- Crea la Pull Request ----------
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-translate DE/FR + rebuild PDFs"
          title: "Auto-translate: update DE/FR + PDFs"
          body: |
            Traduzione automatica + ricompilazione PDF generata da DeepL.

            **File inglesi modificati:**
            `${{ steps.changed.outputs.files }}`

            Controlla le traduzioni e i PDF, poi fai merge quando sei soddisfatto.
          branch: auto-translate/${{ github.run_id }}
          delete-branch: true
          labels: translation, automated