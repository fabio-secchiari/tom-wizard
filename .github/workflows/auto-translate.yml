name: Auto Translate + Build + PR

on:
  # Parte in automatico quando modifichi i capitoli inglesi
  push:
    branches: [main]
    paths:
      - 'chapters/**/*.tex'
      - 'scripts/translate_chapters.py'
      - 'scripts/build_markdown.py'
      - 'Makefile'
      - 'main_*.tex'

  # Pulsante per avviarlo a mano da GitHub
  workflow_dispatch:

# Evita due run in parallelo che si pestano i piedi (release/PR)
concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ========== TEX LIVE ==========
      # Bastano questi pacchetti (verificato: compilano EN/DE/FR).
      # texlive-full era enorme e la vecchia cache puntava a cartelle
      # che apt non usa, quindi non serviva a nulla.
      # pandoc serve per i Markdown del sito.
      - name: Install TeX Live + Ghostscript + Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern ghostscript pandoc

      # ========== TRADUZIONE ==========
      - name: Detect changed English chapters
        id: changed
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          # Manual workflow → translate everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected → translating all chapters"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First push → translate everything
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push detected → translating all chapters"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          git diff --name-only "$BEFORE" "$AFTER"

          # Translation script changed → retranslate everything
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'scripts/translate_chapters.py'; then
            echo "Translation script changed → translating all chapters"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(
            git diff --name-only "$BEFORE" "$AFTER" -- chapters/ \
              | while IFS= read -r file; do
                  case "$file" in
                    *.tex)
                      echo "${file#chapters/}"
                      ;;
                  esac
                done \
              | tr '\n' ' ' \
              | sed 's/[[:space:]]*$//'
          )

          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED" ]; then
            echo "Changed chapters: '$CHANGED'"
          else
            echo "No English chapters changed."
          fi

      # Cache delle traduzioni DeepL: i blocchi già tradotti non consumano quota.
      - name: Restore DeepL translation cache
        uses: actions/cache/restore@v4
        with:
          path: .translation_cache
          key: deepl-cache-${{ github.run_id }}
          restore-keys: deepl-cache-

      - name: Translate changed chapters
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.files }}"

          if [ "$FILES" = "ALL" ]; then
            echo "Translating all chapters..."
            python scripts/translate_chapters.py

          elif [ -n "$FILES" ]; then
            echo "Translating changed chapters:"
            echo "$FILES"

            python scripts/translate_chapters.py $FILES

          else
            echo "No English chapters changed."
          fi

      # Salvata anche se la traduzione fallisce (es. quota esaurita a metà)
      - name: Save DeepL translation cache
        if: always() && hashFiles('.translation_cache/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .translation_cache
          key: deepl-cache-${{ github.run_id }}

      # ========== MARKDOWN (sito web) ==========
      # Rigenera markdown/index*.md dai sorgenti (anche DE/FR appena tradotti).
      # Fallisce se restano comandi LaTeX o se si perdono caratteri speciali.
      - name: Build Markdown for the website
        run: python scripts/build_markdown.py

      # ========== COMPILAZIONE ==========
      - name: Compile all PDFs
        run: make all

      - name: Compress PDFs with Ghostscript
        run: |
          # Imposta una soglia (es. 10 MB) per comprimere solo i file grandi
          MAX_SIZE=10485760

          # Trova tutti i PDF generati (modifica il percorso se necessario, es. build/ o .)
          for pdf in main_en.pdf main_de.pdf main_fr.pdf; do
            size=$(stat -c%s "$pdf")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "📦 Compressione di $pdf (dimensioni: $size byte)..."
              # Usa il profilo /ebook (150 dpi, buon compromesso)
              gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                -dNOPAUSE -dQUIET -dBATCH -sOutputFile="${pdf}.tmp" "$pdf" \
                && mv "${pdf}.tmp" "$pdf"
              # Se vuoi ancora più compressione (qualità minore) usa /screen
              # Se vuoi qualità migliore usa /printer
            else
              echo "⏩ Saltato $pdf (dimensioni: $size byte, sotto soglia)"
            fi
          done

      - name: Prepare release notes
        id: notes
        run: echo "date=$(TZ=Europe/Rome date +'%d/%m/%Y %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Create/Update Release with PDFs
        uses: softprops/action-gh-release@v2
        with:
          name: "📄 Manuale Tradotto - Ultima versione"
          tag_name: "auto-translate-latest"
          body: |
            ## PDF generati automaticamente

            Questa release contiene i PDF tradotti in:
            - 🇬🇧 Inglese (originale)
            - 🇩🇪 Tedesco
            - 🇫🇷 Francese

            **Generato il:** ${{ steps.notes.outputs.date }}

            *I PDF sono compressi per ridurre le dimensioni.*
          files: |
            main_en.pdf
            main_de.pdf
            main_fr.pdf
          fail_on_unmatched_files: true
          prerelease: false
          draft: false

      # ========== PULL REQUEST ==========
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: auto-translate DE/FR + rebuild Markdown/PDFs"
          title: "Auto-translate: update DE/FR + Markdown + PDFs"
          body: |
            Traduzione automatica (DeepL) + Markdown del sito rigenerati + PDF ricompilati.

            **File inglesi modificati:**
            `${{ steps.changed.outputs.files }}`

            Controlla le traduzioni e i PDF, poi fai merge.
          branch: auto-translate/${{ github.run_id }}
          # Committa solo traduzioni e Markdown (niente PDF, log o file di debug)
          add-paths: |
            chapters_de/**
            chapters_fr/**
            markdown/**
          delete-branch: true
          labels: translation, automated