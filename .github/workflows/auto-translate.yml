name: Auto Translate + Build + PR

on:
  # Parte in automatico quando modifichi i capitoli inglesi
  push:
    branches: [main]
    paths:
      - 'src/chapters/**.tex'
      - 'scripts/translate_chapters.py'
      - 'Makefile'
      - 'main_*.tex'

  # Pulsante per avviarlo a mano da GitHub
  workflow_dispatch:

jobs:
  translate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ========== CACHE TEX LIVE (secondo documentazione ufficiale) ==========
      - name: Cache TeX Live
        id: cache-texlive
        uses: actions/cache@v4
        with:
          path: |
            ~/.texlive
            /tmp/texlive
            /usr/local/texlive
          key: texlive-full-${{ runner.os }}-2026-v1
          restore-keys: |
            texlive-full-${{ runner.os }}-2026-
            texlive-full-${{ runner.os }}-

      - name: Install TeX Live (solo se cache miss)
        if: steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      # ========== TRADUZIONE ==========
      - name: Detect changed English chapters
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/chapters/*.tex' 2>/dev/null | xargs -n1 basename 2>/dev/null | tr '\n' ' ' || true)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "File cambiati: '$CHANGED'"

      - name: Translate changed chapters
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            python scripts/translate_chapters.py ${{ steps.changed.outputs.files }}
          else
            echo "Nessun file capitolo modificato → salto traduzione"
          fi

      # ========== COMPILAZIONE ==========
      - name: Compile all PDFs
        run: make all

      # ========== PULL REQUEST ==========
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-translate DE/FR + rebuild PDFs"
          title: "Auto-translate: update DE/FR + PDFs"
          body: |
            Traduzione automatica + ricompilazione PDF generata da DeepL.

            **File inglesi modificati:**
            `${{ steps.changed.outputs.files }}`

            Controlla le traduzioni e i PDF, poi fai merge.
          branch: auto-translate/${{ github.run_id }}
          delete-branch: true
          labels: translation, automated